plugins { id 'com.android.application' }

android {
    namespace 'com.sblearn.scripturelaunchpad'
    compileSdk 34

    defaultConfig {
        applicationId 'com.sblearn.scripturelaunchpad'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    signingConfigs {
        if (System.getenv('KEYSTORE_B64')) {
            release {
                storeType 'PKCS12'
                storeFile file('keystore.p12')
                storePassword System.getenv('KEYSTORE_PASS')
                keyAlias System.getenv('KEY_ALIAS')
                keyPassword System.getenv('KEYSTORE_PASS')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (System.getenv('KEYSTORE_B64')) signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
