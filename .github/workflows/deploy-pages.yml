name: Deploy Scripture Launchpad (Pages)

# Deploys the scripture-launchpad folder to GitHub Pages on every push
# that touches it, so https://canar8ue.github.io/SBLearn/ is the
# installable phone app (PWA). The service worker is regenerated here so
# its precache list + version hash always match the deployed files.

on:
  push:
    branches: [main]
    paths:
      - "scripture-launchpad/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Regenerate service worker (precache = exactly the deployed files)
        run: node tools/build-sw.js
        working-directory: scripture-launchpad

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: scripture-launchpad

      - uses: actions/deploy-pages@v4
        id: deployment
